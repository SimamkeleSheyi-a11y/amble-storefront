<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order History — AMBLE</title>
  <script>(function(){var s=localStorage.getItem("amble-theme");document.documentElement.setAttribute("data-theme",s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/base.css" /><link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/polish.css" />
  <link rel="stylesheet" href="css/reliability.css" />
  <link rel="stylesheet" href="css/commerce.css" />
  <link rel="stylesheet" href="css/engagement.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a><header id="site-nav"></header>
  <main class="container page-shell" id="main-content">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/index.html">Shop</a><span class="breadcrumbs__sep"></span><span aria-current="page">Orders</span></nav>
    <div class="page-heading"><div><p class="page-heading__eyebrow">Your account</p><h1 class="page-title">Order history</h1></div><p class="page-subtitle" id="order-count">Loading orders…</p></div>
    <div class="order-tools" aria-label="Filter orders">
      <div class="form-field">
        <label for="order-search">Search orders</label>
        <input id="order-search" type="search" placeholder="Order number or product" />
      </div>
      <div class="form-field">
        <label for="order-status-filter">Status</label>
        <select id="order-status-filter">
          <option value="">All statuses</option>
          <option value="placed">Placed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div id="orders-container"><div class="skeleton skeleton-line" style="height:150px;margin-bottom:1rem"></div><div class="skeleton skeleton-line" style="height:150px"></div></div>
  </main>
  <footer id="site-footer"></footer><script src="config.js"></script><script type="module" src="js/pages/orders.js"></script>
</body>
</html>
