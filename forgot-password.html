<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — AMBLE</title>
  <script>(function(){var s=localStorage.getItem("amble-theme");document.documentElement.setAttribute("data-theme",s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/polish.css" />
  <link rel="stylesheet" href="css/reliability.css" />
  <link rel="stylesheet" href="css/commerce.css" />
  <link rel="stylesheet" href="css/engagement.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="site-nav"></header>
  <main class="auth-panel account-page" id="main-content">
    <div class="auth-card">
      <a class="auth-card__back" href="/login.html">← Back to login</a>
      <p class="eyebrow">Account recovery</p>
      <h1 class="auth-card__title">Reset your password</h1>
      <p class="auth-card__intro">Enter your account email. In local development, the reset link appears in the Django backend terminal.</p>
      <form class="form" id="forgot-form">
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="btn btn--primary btn--block" id="submit-button" type="submit">Send reset link</button>
      </form>
      <div class="reliability-alert" id="success-message" hidden tabindex="-1"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="config.js"></script><script type="module" src="js/pages/forgot-password.js"></script>
</body>
</html>
